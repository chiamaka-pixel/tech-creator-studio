
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Content | Tech Creator Studio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f8fa;
            color: #222;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        form p label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #222;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #444;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #333;
            text-decoration: none;
        }

        .errorlist {
            color: #b00020;
        }
    </style>
</head>

<body>

    <a class="back-link" href="{% url 'content:item_list' %}">
        &larr; Back to dashboard
    </a>

    <div class="form-container">

<h1>
    {% if object %}
        Edit Content
    {% else %}
        Create Content
    {% endif %}
</h1>
        <p class="subtitle">
            Add a new content idea or prepare a post for Facebook.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
    {% if object %}Update Content{% else %}Save Content{% endif %}
</button>
        </form>

    </div>

</body>
</html>
