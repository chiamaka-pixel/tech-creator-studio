<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Content Performance | Tech Creator Studio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f7f8fa;
            color: #222;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
        }

        button {
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 15px;
            color: #333;
            text-decoration: none;
        }

        .help {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Content Performance</h1>

        <p class="description">
            Record the performance of:
            <strong>{{ item.title }}</strong>
        </p>

        <p class="help">
            Enter the statistics shown in your Facebook professional
            dashboard or insights. Use zero when a metric is not available.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save Performance
            </button>

            <a class="cancel"
               href="{% url 'content:item_detail' item.pk %}">
                Cancel
            </a>
        </form>

    </div>

</body>
</html>
