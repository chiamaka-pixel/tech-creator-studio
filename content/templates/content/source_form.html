<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Manage Source | Tech Creator Studio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f7f8fa;
            color: #222;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        form p {
            margin-bottom: 18px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 110px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 15px;
            color: #333;
            text-decoration: none;
        }

        .errors {
            color: #c62828;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>
            {% if object %}
                Edit Source Link
            {% else %}
                Add Source Link
            {% endif %}
        </h1>

        <p>Content item: <strong>{{ item.title }}</strong></p>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="errors">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {{ form.as_p }}

            <button type="submit">
                {% if object %}
                    Save Changes
                {% else %}
                    Add Source
                {% endif %}
            </button>

            <a class="cancel"
               href="{% url 'content:item_detail' item.pk %}">
                Cancel
            </a>
        </form>
    </div>

</body>
</html>
